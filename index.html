<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The SPEED favicon, deliberately kept rather than swapped for a client
         mark. It is byte-identical across every deck in this workspace, so it is
         the SPEED house tab icon, not a client asset. -->
    <link rel="icon" type="image/png" href="/icons/tab_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===================================================================
         THIS FILE CARRIES NO BRAND VALUES.
         The three placeholders below are filled from the theme container by
         the `speed-accelerator-theme` plugin in vite.config.ts, in dev and in
         build alike. Re-skinning the deck means editing theme/index.ts and
         nothing here.

         It previously held a 17 line `:root` palette mirror, a 50 line inline
         `tailwind.config`, a font <link> and a hardcoded title: four separate
         places a client value could go stale.
         =================================================================== -->
    <title><!--@theme:title--></title>
    <!--@theme:fonts-->
    <!--@theme:css-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
