<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The SPEED favicon, deliberately kept rather than swapped for a Lyka mark.
         It is byte-identical across the Lyka RFI, the Lyka Showcase and the
         Hamilton Island decks, so it is the SPEED house tab icon, not a client
         asset. (The declared type was image/svg+xml on a .png; corrected.) -->
    <link rel="icon" type="image/png" href="/icons/tab_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyka Audience Accelerator | SPEED</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Poppins (display) + DM Sans 300..700 (body) + DM Mono (labels). Matches
         RFI - Lyka. DM Sans 300 is required: the Lyka system uses 300 on dark. -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Tailwind is CDN-only here (no tailwind.config.js), so this inline config
      // is the only way to get real Lyka utilities (bg-lyka-cream, text-lyka-ink).
      // MUST come after the CDN script above.
      // MUST use theme.extend.colors: theme.colors would REPLACE the default
      // palette and break every text-gray-* / bg-white in the app.
      // Do NOT add fontFamily.display here: it would generate a .font-display
      // utility that races the hand-written rule in the <style> block below.
      tailwind.config = {
        theme: {
          extend: {
            // ONE CUSTOM BREAKPOINT, and it exists because the stock scale is
            // backwards for this app's grids.
            //
            // The sidebar takes 320px, so a 1280 viewport is the TIGHTEST layout
            // here, not a roomy one. Tailwind's `xl:` fires at exactly 1280 and
            // `2xl:` not until 1536, so there is no stock step that means "1440
            // and up, where there is actually room". Measured on the Ten Things
            // grid: a tile is 171x277 at 1280 with as little as 10px of slack,
            // and 203x339 at 1440 with 98 to 147px. Those want different type.
            //
            // This is the same trap the variant views hit: a viewport query is
            // not a container query. Use `roomy:` only where a measurement says
            // the box actually grows past 1400.
            screens: { roomy: '1400px' },

            // MIRRORS the TYPE object in data/type.ts. Change both together.
            // Eight steps, replacing the ~18 ad hoc sizes that were in use
            // across the variant views. `micro` is the only step under 12px and
            // is for UPPERCASE MONO EYEBROWS ONLY.
            fontSize: {
              micro: ['11px', { lineHeight: '1.35' }],
              meta: ['12px', { lineHeight: '1.4' }],
              label: ['13px', { lineHeight: '1.4' }],
              body: ['14px', { lineHeight: '1.5' }],
              lead: ['16px', { lineHeight: '1.55' }],
              title: ['18px', { lineHeight: '1.3' }],
              figure: ['24px', { lineHeight: '1' }],
              display: ['30px', { lineHeight: '1.15' }],
            },
            colors: {
              lyka: {
                'teal-deep': '#003D33',
                teal: '#005648',
                ink: '#143C33',
                accent: '#10B193',
                'accent-ink': '#0A7D68',
                orange: '#FF886B',
                tangerine: '#F68B1F',
                peach: '#FEE9DA',
                page: '#FFFBED',
                ivory: '#F9F6F1',
                cream: '#F0F2E9',
                mint: '#DBE6DC',
                'mint-muted': '#A9C3B4',
                muted: '#5B6E64',
              },
            },
          },
        },
      };
    </script>
    <style>
      /* ---------------------------------------------------------------------
         LYKA x SPEED brand tokens.
         This block MIRRORS the LYKA object in data/brand.ts. Change both together.
         brand.ts is the source of truth for anything a chart or the Worker reads;
         these vars are for inline style={{ }} in components (Tailwind CDN cannot
         reach custom properties as utilities).
         --------------------------------------------------------------------- */
      :root {
        --lyka-teal-deep: #003D33;
        --lyka-teal: #005648;
        --lyka-ink: #143C33;
        --lyka-accent: #10B193;
        --lyka-accent-ink: #0A7D68;
        --lyka-orange: #FF886B;
        --lyka-tangerine: #F68B1F;
        --lyka-peach: #FEE9DA;
        --lyka-page: #FFFBED;
        --lyka-ivory: #F9F6F1;
        --lyka-cream: #F0F2E9;
        --lyka-mint: #DBE6DC;
        --lyka-mint-muted: #A9C3B4;
        --lyka-muted: #5B6E64;
        --lyka-border: rgba(0, 86, 72, 0.08);
        --lyka-shadow: 0 18px 40px -16px rgba(0, 86, 72, 0.22);
        --lyka-ease: cubic-bezier(0.4, 0, 0.2, 1);

        /* SPEED brand mark. Reserved for the SPEED wordmark only. */
        --speed-red: #E8151B;
      }

      html, body {
        font-family: 'DM Sans', system-ui, sans-serif;
        color: var(--lyka-ink);
        background: var(--lyka-page);
      }
      h1, h2, h3, h4, h5, h6, .font-display {
        font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif;
        letter-spacing: -0.015em;
      }
      .font-mono, code, pre {
        font-family: 'DM Mono', monospace;
      }
      /* Lyka uses ONE easing curve for everything. This puts the whole app on it
         without touching the ~15 scattered ease-in-out utilities. */
      *, *::before, *::after {
        transition-timing-function: var(--lyka-ease);
      }

      /* ---------------------------------------------------------------------
         Page entry animation.
         Lives here rather than in a component. It used to be created by
         document.createElement('style') at MODULE SCOPE in both Personas.tsx and
         CustomerJourney.tsx, injecting the identical rule twice as a side effect
         of importing a page. Any component using .animate-fadeIn was silently
         depending on one of those two imports having run.
         --------------------------------------------------------------------- */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-fadeIn {
        animation: fadeIn 0.5s ease-in-out forwards;
      }

      /* ---------------------------------------------------------------------
         Scrollbar for the detail panels.
         .custom-scrollbar was already applied in PersonaDetail and CategoryDetail
         but was never defined anywhere, so it was inert. Defined now because the
         new views scroll considerably more.
         --------------------------------------------------------------------- */
      .custom-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: var(--lyka-mint) transparent;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: var(--lyka-mint);
        border-radius: 999px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: var(--lyka-mint-muted);
      }

      /* ---------------------------------------------------------------------
         Persona chips, in the Readiness Ladder and the Mindset Flow.

         Both were INERT on hover. In the ladder that was actively misleading:
         the stage band behind the chips highlights with a 2px outline in its own
         base colour, so hovering a chip lit up the BAND and the chip read as
         part of it rather than as its own target. In the flow the only
         affordance was the cursor.

         The treatment is the band's own language, so the two now match: wash the
         fill toward white and ring it 2px in the segment's base colour.

         WHY CSS AND NOT REACT STATE. A `hoveredId` in state re-renders on every
         mouseover, and MindsetFlow is a large SVG that recomputes its viewBox
         from a measured container. Hover has no business in the render path.
         The per segment colours cannot be Tailwind utilities either, so they
         arrive as inline custom properties and only the BEHAVIOUR lives here.
         Same reasoning, and same home, as .custom-scrollbar above.
         --------------------------------------------------------------------- */
      /* The RESTING fill is a custom property too, not an inline
         background-color. Inline style outranks any stylesheet rule, so the
         hover below could never have overridden it, while the ring, which
         nothing sets inline, would have worked. Half a hover state, silently. */
      .persona-chip {
        cursor: pointer;
        background-color: var(--chip-bg);
        transition: background-color 150ms var(--lyka-ease),
                    box-shadow 150ms var(--lyka-ease);
      }
      /* focus-visible shares the rule so a keyboard user gets the same highlight.
         This replaced a bare Tailwind `focus-visible:ring-2`, which drew the
         default blue. */
      .persona-chip:hover,
      .persona-chip:focus-visible {
        background-color: var(--chip-hover-bg);
        box-shadow: inset 0 0 0 2px var(--chip-hover-ring);
        outline: none;
      }

      /* The same chip drawn as an SVG rect. box-shadow does not apply to SVG
         geometry, so the ring is the rect's own stroke. */
      .persona-chip-svg rect {
        transition: fill 150ms var(--lyka-ease),
                    stroke 150ms var(--lyka-ease),
                    stroke-width 150ms var(--lyka-ease);
      }
      .persona-chip-svg:hover rect,
      .persona-chip-svg:focus-visible rect {
        fill: var(--chip-hover-bg);
        stroke: var(--chip-hover-ring);
        stroke-width: 2;
      }
      .persona-chip-svg:focus-visible {
        outline: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .animate-fadeIn { animation: none; }
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
